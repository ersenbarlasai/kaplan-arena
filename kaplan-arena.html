<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaplan Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen arena. Striped marquee on the menu, a thin control bar during play, the question as hero,
   the timer as a dial at the side, class chips as the live scoreboard. Phones get a Kahoot-style 2x2 answer pad. */
:root{
  --bg:#0d0f14;
  --surface:#171a22;
  --surface-2:#20242f;
  --line:#323848;
  --fg:#f6f1e7;
  --muted:#a3a8b8;
  --accent:#ff9f1c;
  --accent-ink:#1f1100;
  --stripe:#1a1205;
  --good:#3ddc84;
  --bad:#ff5a5a;
  --t1:#ff5d8f; --t2:#36c5f0; --t3:#8be04e; --t4:#ffe14d; --t5:#b58cff; --t6:#2fe0c4;
  --ka:#e5484d; --kb:#3e8ef7; --kc:#e8a800; --kd:#30a46c;
  --font-display:'Bungee', 'Arial Black', Impact, sans-serif;
  --font-body:'Rubik', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,159,28,.12), transparent 70%);
  background-attachment:fixed;
}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.btn{border:1px solid var(--line);background:var(--surface-2);padding:.65em 1.1em;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:transform .12s, background .15s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{font-size:clamp(1.05rem,1.6vw,1.35rem);padding:.8em 1.4em}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.small{padding:.35em .7em;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font-family:var(--font-body);font-size:.75em;border:1px solid currentColor;border-radius:4px;padding:0 .35em;opacity:.7}

/* menu */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-block:32px;text-align:center}
.marquee{position:relative;padding:30px clamp(20px,5vw,64px) 26px;border:3px solid var(--accent);border-radius:22px;max-width:100%;overflow:hidden;
  background:repeating-linear-gradient(-58deg, var(--surface) 0 26px, var(--stripe) 26px 40px)}
.marquee h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,8vw,5.6rem);line-height:1;color:var(--accent);letter-spacing:.02em;text-shadow:0 0 30px rgba(255,159,28,.4), 0 4px 0 #000}
.marquee p{margin:12px 0 0;color:var(--fg);font-weight:600;font-size:clamp(.95rem,1.4vw,1.15rem)}
.menu-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.status{color:var(--muted);font-size:.95rem}
.netpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:.3em .9em;font-size:.85rem;color:var(--muted)}
.netpill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.netpill.on i{background:var(--good)} .netpill.on{color:var(--fg)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-width:860px;width:100%}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.rule b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.rule span{color:var(--muted);font-size:.85rem}
.keys{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}

.confirm{background:var(--surface-2);border:1px solid var(--bad);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:640px}
.confirm p{margin:0;flex:1 1 220px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center}

/* game shell */
.game{flex:1;display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb-title{font-family:var(--font-display);color:var(--accent);font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stage{font-family:var(--font-display);background:var(--accent);color:var(--accent-ink);padding:.25em .8em;border-radius:999px;font-size:.95rem}
.tb-pin{font-family:var(--font-display);font-size:.95rem;border:2px solid var(--accent);color:var(--accent);padding:.2em .7em;border-radius:999px;font-variant-numeric:tabular-nums}
.stage-main{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:20px}

.strip{display:flex;flex-wrap:wrap;gap:10px}
.chip{--c:var(--t1);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:8px 14px;flex:1 1 130px;min-width:0}
.chip .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sc{font-family:var(--font-display);font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--c)}
.ans-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans-strip .lbl{color:var(--muted);font-size:.85rem;font-weight:600;margin-right:4px}
.ans{--c:var(--t1);border:1px solid var(--line);border-radius:999px;padding:.2em .75em;font-size:.9rem;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ans.yes{border-color:var(--c);color:var(--fg);background:color-mix(in srgb, var(--c) 18%, transparent)}
.ans b{font-family:var(--font-display);font-weight:400}

/* question */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
@media (max-width:760px){.qwrap{grid-template-columns:1fr}}
.qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tag{font-family:var(--font-display);font-size:.9rem;padding:.3em .8em;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.03em}
.tag.tahmin{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnum{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(1.5rem,3.4vw,3.2rem);font-weight:700;line-height:1.2;margin:0 0 22px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{--k:var(--ka);display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--k);border-radius:var(--r);padding:14px 18px;font-size:clamp(1.05rem,2vw,1.8rem);font-weight:600;transition:all .3s;min-width:0}
.opt .L{font-family:var(--font-display);width:1.8em;height:1.8em;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--k);color:#fff;font-size:.85em}
.opt.correct{border-color:var(--good);background:color-mix(in srgb, var(--good) 22%, var(--surface));box-shadow:0 0 0 4px color-mix(in srgb, var(--good) 30%, transparent)}
.opt.dim{opacity:.35}
.guess-hint{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:20px;font-size:clamp(1rem,1.8vw,1.5rem);color:var(--muted);text-align:center}
.reveal-num{background:color-mix(in srgb, var(--good) 18%, var(--surface));border:2px solid var(--good);border-radius:var(--r);padding:18px 22px;text-align:center}
.reveal-num small{display:block;color:var(--muted);font-size:1rem;font-weight:600}
.reveal-num b{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,6vw,5rem);color:var(--good);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.reveal-num i{font-style:normal;font-size:clamp(1.1rem,2.4vw,2rem);margin-left:.3em}

.side{display:flex;flex-direction:column;align-items:center;gap:12px}
.dial{position:relative;width:clamp(150px,17vw,230px);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--surface-2);fill:var(--surface)}
.dial .prog{stroke:var(--accent);fill:none;stroke-linecap:round;transition:stroke-dashoffset .25s linear, stroke .3s}
.dial .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(2.6rem,5vw,4.4rem);font-variant-numeric:tabular-nums}
.dial .lbl{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.dial.warn .prog{stroke:var(--bad)} .dial.warn .num{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.dial.warn.run .num{animation:pulse 1s infinite}}
@keyframes pulse{50%{transform:scale(1.08)}}
.dial.done .num{color:var(--bad)}
.side .btns{display:flex;flex-direction:column;gap:8px;width:100%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:1.15rem}
.panel .note{color:var(--muted);font-size:.9rem;margin:0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pick button{--c:var(--t1);border:2px solid var(--line);border-left:8px solid var(--c);background:var(--surface-2);border-radius:10px;padding:12px 14px;text-align:left;font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.pick button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button.on{border-color:var(--good);background:color-mix(in srgb, var(--good) 20%, var(--surface-2))}
.pick button .mark{font-family:var(--font-display);color:var(--good);opacity:0}
.pick button.on .mark{opacity:1}
.guesses{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.guess{--c:var(--t1);display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--c);padding-left:10px}
.guess label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.field,select.field,textarea.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6em .75em;width:100%;min-width:0}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--accent);outline:none}
.guess input{font-size:1.2rem;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

.board-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.board-h h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,3.5vw,2.8rem);color:var(--accent)}
.board-h span{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{--c:var(--t1);display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb, var(--c) 22%, transparent);border-right:3px solid var(--c);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar > *:not(.fill){position:relative}
.bar .rk{font-family:var(--font-display);font-size:1.4rem;color:var(--muted);text-align:center}
.bar .nm{font-weight:700;font-size:clamp(1.05rem,2vw,1.6rem);display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.bar .nm > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .pts{font-family:var(--font-display);font-size:clamp(1.5rem,3vw,2.4rem);color:var(--c);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.bar .from{font-size:1rem;font-family:var(--font-body);color:var(--muted)}
.plus{font-family:var(--font-display);font-size:.8rem;background:var(--good);color:#04210f;padding:.15em .5em;border-radius:6px}
.badge{font-family:var(--font-display);font-size:.75rem;padding:.2em .6em;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.badge.tie{background:var(--bad);color:#fff}
.bar.out{opacity:.5}
.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th,.gtable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.gtable th{color:var(--muted);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.gtable tr.win td{color:var(--good);font-weight:700}
.tscroll{overflow-x:auto}
.center-card{max-width:1000px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.notice{background:color-mix(in srgb, var(--bad) 14%, var(--surface));border:1px solid var(--bad);border-radius:12px;padding:14px 16px;font-size:1.05rem}
.notice.ok{background:color-mix(in srgb, var(--good) 14%, var(--surface));border-color:var(--good)}
.notice.info{background:var(--surface);border-color:var(--line);color:var(--muted);font-size:.95rem}

/* lobby */
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.joinbox{background:#fff;color:#111;border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:100%}
.joinbox .qr{max-width:100%;display:grid;place-items:center}
.joinbox .qr img,.joinbox .qr canvas{max-width:100%;height:auto}
.joinbox small{font-weight:600;color:#555}
.joinbox .pin{font-family:var(--font-display);font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:.08em;line-height:1;color:#111;font-variant-numeric:tabular-nums}
.joinbox .url{font-size:.85rem;color:#333;word-break:break-all;max-width:260px}
.jlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.jl{--c:var(--t1);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:14px 16px;font-weight:700;font-size:1.25rem}
.jl em{font-style:normal;font-size:.8rem;font-weight:600;color:var(--muted)}
.jl.on em{color:var(--good)}

/* draw */
.draw-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.draw-cols{grid-template-columns:1fr}}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.dcol h3{font-family:var(--font-display);font-weight:400;color:var(--accent);font-size:1.4rem}
.dtile{font-family:var(--font-display);font-size:clamp(1.2rem,2.2vw,1.7rem);background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center}
.dtile.wait{color:var(--line);border-style:dashed}
.dtile span{font-family:var(--font-body);font-size:.85rem;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.dtile.new{animation:land .5s cubic-bezier(.2,1.4,.4,1)}}
@keyframes land{from{transform:scale(1.5);opacity:0}}
.drum{font-family:var(--font-display);font-size:clamp(2.6rem,8vw,5.5rem);text-align:center;color:var(--accent);line-height:1.1;min-height:1.2em;text-shadow:0 0 40px rgba(255,159,28,.5)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pool span{font-family:var(--font-display);font-size:1.5rem;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.3em .8em}

/* champion */
.champ{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:20px}
.champ .crown{font-family:var(--font-display);color:var(--accent);font-size:clamp(1.2rem,2.5vw,2rem);letter-spacing:.2em}
.champ h2{font-family:var(--font-display);font-weight:400;font-size:clamp(3rem,10vw,8rem);line-height:1.05;color:var(--c, var(--accent));text-shadow:0 0 40px color-mix(in srgb, var(--c, var(--accent)) 50%, transparent);max-width:100%;overflow-wrap:anywhere}
.champ .score{font-size:1.3rem;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* manage */
.page{max-width:1080px;width:100%;margin:0 auto;padding-block:20px;display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.page-h h2{font-family:var(--font-display);font-weight:400;color:var(--accent);font-size:clamp(1.4rem,3vw,2.2rem);flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button .ct{font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:.05em .55em;margin-left:6px}
.summary{color:var(--muted)}
.summary.warn{color:var(--accent)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:2em auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:700px){.qrow{grid-template-columns:2em minmax(0,1fr)}.qrow .acts{grid-column:1/-1;justify-content:flex-end}.qrow .tag{justify-self:start}}
.qrow .n{font-family:var(--font-display);color:var(--muted);text-align:center}
.qrow .tag{font-size:.7rem;white-space:nowrap}
.qrow .tx{min-width:0}
.qrow .tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .tx small{color:var(--good)}
.qrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.section h3{font-size:1.1rem}
.section p{margin:0;color:var(--muted);font-size:.92rem}
textarea.field{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.78);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-family:var(--font-display);font-weight:400;color:var(--accent);font-size:1.3rem}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label{font-weight:600;font-size:.9rem;color:var(--muted)}
.fld .hint{font-size:.8rem;color:var(--muted)}
.optedit{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center}
.optedit b{font-family:var(--font-display);color:var(--accent)}
.optedit input[type=radio]{width:20px;height:20px;accent-color:var(--good)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* ---------- player (phone) ---------- */
.pl{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px;max-width:560px;width:100%;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-top .brand{font-family:var(--font-display);color:var(--accent);font-size:1.1rem;flex:1}
.pl-top .me{--c:var(--t1);font-family:var(--font-display);background:var(--c);color:#111;border-radius:999px;padding:.2em .8em}
.pl-top .pts{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.pl-hero{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding-block:20px}
.pl-hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,12vw,3.6rem);color:var(--accent);line-height:1}
.pl-hero p{margin:0;color:var(--muted)}
.pinput{font-family:var(--font-display);font-size:2.4rem;text-align:center;letter-spacing:.2em;width:100%;max-width:320px;background:var(--surface);border:3px solid var(--accent);border-radius:14px;padding:.3em .2em;font-variant-numeric:tabular-nums}
.pl .err{color:var(--bad);font-weight:600;text-align:center}
.pl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pl-card.big{text-align:center;padding:28px 18px}
.pl-card.big h2{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1.1}
.pl-card.good{border-color:var(--good);background:color-mix(in srgb, var(--good) 15%, var(--surface))}
.pl-card.good h2{color:var(--good)}
.pl-card.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, var(--surface))}
.pl-card.bad h2{color:var(--bad)}
.pl-q{font-size:1.25rem;font-weight:700;line-height:1.3;margin:0}
.pl-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.pl-time{font-family:var(--font-display);font-size:1.6rem;color:var(--fg);font-variant-numeric:tabular-nums}
.pl-time.warn{color:var(--bad)}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad button{--k:var(--ka);background:var(--k);border:none;border-radius:16px;min-height:118px;padding:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .1s, opacity .2s}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pad button .sh{font-size:1.9rem;line-height:1}
.pad button b{font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.pad button span{overflow-wrap:anywhere}
.pad button.mine{outline:5px solid #fff;outline-offset:-5px}
.pad.locked button:not(.mine){opacity:.35}
.pad button:disabled{cursor:default}
.numin{display:flex;gap:10px}
.numin input{font-size:1.6rem;text-align:center;font-variant-numeric:tabular-nums}
.sent{text-align:center;font-weight:700;color:var(--good)}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plist button{--c:var(--t1);background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:16px 12px;font-family:var(--font-display);font-size:1.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.plist button em{font-family:var(--font-body);font-style:normal;font-size:.75rem;color:var(--muted);font-weight:600}
.plist button.taken em{color:var(--accent)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.9rem;align-self:center;padding:6px}
</style>

function isOldSampleSet(qs){
  try{
    const all = ['s1','s2','final','tie'].flatMap(k=>qs[k]||[]);
    if (!all.length) return false;
    const set = new Set(OLD_SAMPLE_TEXTS);
    return all.every(q=>set.has(q.text));
  }catch(e){ return false; }
}

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if (!raw){
      const old = localStorage.getItem('bilgi-yarismasi-v1');
      if (old){ const o = JSON.parse(old); if (o && o.questions){ const d = defaultState(); d.questions = o.questions; return d; } }
      return null;
    }
    const s = JSON.parse(raw);
    if (!s || !s.questions || !s.game || !s.settings) return null;
    const d = defaultState();
    s.settings = Object.assign(d.settings, s.settings);
    for (const k of ['s1','s2','final','tie']) if (!Array.isArray(s.questions[k])) s.questions[k] = [];
    if (isOldSampleSet(s.questions)) s.questions = sampleQuestions();
    s.game = Object.assign(newGame(), s.game);
    return s;
  }catch(e){ return null; }
}

/* audio */
let AC = null;
function initAudio(){ if (AC || !S || !S.settings.sound) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(freq, dur, type){
  if (!S || !S.settings.sound || !AC) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(.25, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* timer */
function resetTimer(){ stopTimer(); TM.left = S.settings.seconds; paintTimer(); sync(); }
function startTimer(){
  if (TM.left <= 0) TM.left = S.settings.seconds;
  TM.running = true; TM.end = Date.now() + TM.left*1000; TM.endServer = nowS() + TM.left*1000;
  clearInterval(TM.h); TM.h = setInterval(tick, 150); sync();
}
function stopTimer(){ clearInterval(TM.h); TM.h = null; TM.running = false; }
function toggleTimer(){ if (TM.running){ stopTimer(); sync(); } else startTimer(); paintTimer(); }
function tick(){
  const left = Math.max(0, Math.ceil((TM.end - Date.now())/1000));
  if (left !== TM.left){
    TM.left = left;
    if (left <= 5 && left > 0) beep(880, .09);
    if (left === 0){
      beep(196, .9, 'sawtooth'); stopTimer(); sync();
      const g = G();
      if (g.view === 'question' && !g.revealed) setTimeout(()=>{ ACT.reveal(); autoScore(); }, 1500);
      else if (g.view === 'tie' && g.tie && !g.tie.revealed && S.questions.tie[g.tie.poolIdx]) setTimeout(()=>{ ACT.tieReveal(); autoScore(); }, 1500);
    }
    paintTimer();
  }
}
const AUTO_SECS = 4;
function autoCancel(){ clearInterval(ui.autoH); ui.autoH = null; ui.autoLeft = null; ui.autoKey = null; }
function autoScore(){
  autoCancel();
  if (ui.screen !== 'game') return;
  ui.autoKey = currentQk(); ui.autoLeft = AUTO_SECS; render();
  ui.autoH = setInterval(()=>{
    const g = G();
    if (ui.screen !== 'game' || currentQk() !== ui.autoKey || !(g.view === 'question' || g.view === 'tie')){ autoCancel(); render(); return; }
    ui.autoLeft--;
    const el = document.querySelector('#auto-note b'); if (el) el.textContent = Math.max(0, ui.autoLeft);
    if (ui.autoLeft <= 0){
      autoCancel(); prefill();
      if (g.view === 'question' && g.revealed) ACT.saveScore();
      else if (g.view === 'tie' && g.tie && g.tie.revealed) ACT.resolveTie();
      else render();
    }
  }, 1000);
}

function paintTimer(){
  const dial = document.getElementById('dial'); if (!dial) return;
  const total = S.settings.seconds, C = 2*Math.PI*54;
  dial.querySelector('.num').textContent = TM.left;
  dial.querySelector('.prog').style.strokeDashoffset = C*(1 - TM.left/total);
  dial.classList.toggle('warn', TM.left <= 10);
  dial.classList.toggle('done', TM.left === 0);
  dial.classList.toggle('run', TM.running);
  const b = document.getElementById('tbtn');
  if (b) b.innerHTML = (TM.running ? 'Durdur' : (TM.left < total && TM.left > 0 ? 'Devam Et' : 'Süreyi Başlat')) + ' <kbd>Boşluk</kbd>';
}

function qLabel(q){ return q.type === 'tahmin' ? 'Tahmin Sorusu' : esc(q.subject); }
function cutoff(scores, slots){
  const sorted = [...scores].sort((a,b)=>b.score-a.score);
  if (sorted.length <= slots) return {qualified: sorted.map(x=>x.i), tie:null};
  const boundary = sorted[slots-1].score;
  const above = sorted.filter(x=>x.score > boundary).map(x=>x.i);
  const at = sorted.filter(x=>x.score === boundary).map(x=>x.i);
  const remaining = slots - above.length;
  if (at.length === remaining) return {qualified:[...above, ...at], tie:null};
  return {qualified:above, tie:{candidates:at, slots:remaining}};
}

let syncTimer = null;
function sync(){
  if (!NET.ok || !S.game.started || !S.game.pin) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ try{ NET.db.ref('games/'+S.game.pin+'/state').set(buildState()); }catch(e){ console.error(e); } }, 60);
}
function buildState(){
  const g = G(), st = STAGES[g.stage], key = st.key, teams = g.teams[key] || [];
  const s = { title:S.settings.title, v:g.view, stage:key, stageName:st.name, teams:teams.map(t=>t.name), scores:teams.map(t=>t.score),
    qk:currentQk(), q:null, qn:0, qt:S.questions[key].length, open:false, deadline:null, timeUp:false, revealed:false, answer:null,
    eligible:null, lastWinners:null, qualified:null, tiePending:false, champ:null, draw:null, ts:TS() };
  if (g.view === 'draw') s.draw = g.draw && ui.drawShown == null ? g.draw : null;
  if (g.view === 'question'){
    const q = S.questions[key][g.qIndex];
    s.q = g.shown ? pubQ(q) : null; s.hidden = !g.shown; s.qType = q ? q.type : null; s.qn = g.qIndex + 1;
    s.open = TM.running; s.deadline = TM.running ? TM.endServer : null; s.timeUp = TM.left === 0;
    s.revealed = g.revealed; s.answer = g.revealed && q ? q.answer : null;
  }
  if (g.view === 'tie' && g.tie){
    const q = S.questions.tie[g.tie.poolIdx];
    s.q = q ? pubQ(q) : {type:'tahmin', text:'Sunucunun sorduğu eşitlik sorusunu dinleyin ve tahmininizi yazın.', unit:''};
    s.eligible = g.tie.candidates; s.open = TM.running; s.deadline = TM.running ? TM.endServer : null; s.timeUp = TM.left === 0;
    s.revealed = !!g.tie.revealed; s.answer = g.tie.revealed && q ? q.answer : null;
  }
  if (g.view === 'scoreboard' && g.last){ s.lastWinners = g.last.winners; s.answer = g.last.answer; s.qn = g.qIndex + 1; }
  if (g.view === 'stageEnd' && g.result){ s.qualified = g.result.qualified; s.tiePending = !!g.result.tie; s.eligible = g.result.tie ? g.result.tie.candidates : null; }
  if (g.view === 'champion' && g.result) s.champ = g.result.qualified[0];
  return s;
}
function netWatch(){
  if (!NET.ok || !S.game.started) return;
  const pin = S.game.pin, qk = currentQk();
  if (NET.live.qk !== qk || NET.live.pin !== pin){
    if (NET.live.ref) NET.live.ref.off('value', NET.live.fn);
    NET.live = {qk, pin, ans:{}, ref:null, fn:null};
    if (qk){
      const ref = NET.db.ref(`games/${pin}/answers/${qk}`);
      const fn = snap => { NET.live.ans = snap.val() || {}; paintAnswers(); };
      ref.on('value', fn); NET.live.ref = ref; NET.live.fn = fn;
    }
  }
  const pk = pin + '/' + stageKey();
  if (NET.plKey !== pk){
    if (NET.plRef) NET.plRef.off('value', NET.plFn);
    NET.plKey = pk; NET.joined = {};
    NET.plRef = NET.db.ref(`games/${pin}/players/${stageKey()}`);
    NET.plFn = snap => { NET.joined = snap.val() || {}; paintJoined(); };
    NET.plRef.on('value', NET.plFn);
  }
}

function paintAnswers(){

  if (el){
    const idxs = g.view === 'tie' && g.tie ? g.tie.candidates : teams.map((t,i)=>i);

      return `<span class="ans ${a?'yes':''}" style="--c:${tcol(i)}">${esc(teams[i] ? teams[i].name : '')} ${show}</span>`; }).join('');
  }
  if (!ui.touched && prefill()) render();

function prefill(){
  if (!NET.ok) return false;
  const g = G(), key = stageKey(), teams = g.teams[key] || [];
  const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  if (g.view === 'question' && g.revealed){
    const q = S.questions[key][g.qIndex]; if (!q) return false;
    if (q.type === 'ders'){
      const sel = teams.map((t,i)=>{ const a = liveAns(i); return a && a.v === q.answer ? i : -1; }).filter(i=>i>=0);
      if (!same(sel, ui.sel)){ ui.sel = sel; return true; }
    } else {
      const gs = {}; teams.forEach((t,i)=>{ const a = liveAns(i); if (a && a.v !== null && a.v !== '') gs[i] = numStr(a.v); });
      if (!same(gs, ui.guesses)){ ui.guesses = gs; return true; }
    }
  }
  if (g.view === 'tie' && g.tie){
    const gs = {}; g.tie.candidates.forEach(i=>{ const a = liveAns(i); if (a && a.v !== null && a.v !== '') gs[i] = numStr(a.v); });
    if (Object.keys(gs).length && !same(gs, ui.guesses)){ ui.guesses = gs; return true; }
  }
  return false;
}

function drawSeq(d){ const seq = []; const m = Math.max(d.s1.length, d.s2.length); for (let i=0;i<m;i++){ if (d.s1[i]) seq.push(['s1',i]); if (d.s2[i]) seq.push(['s2',i]); } return seq; }
function vDraw(){
  const g = G(), cls = S.settings.classes;
  if (!g.draw){
    const n = cls.length;
    return `<div class="center-card">
      <div class="board-h"><h2>Kura</h2><span>${n} sınıf iki etaba ayrılacak: 1. Etap ${Math.ceil(n/2)} sınıf, 2. Etap ${Math.floor(n/2)} sınıf</span></div>
      <div class="pool">${cls.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      ${NET.ok ? `<div class="lobby"><div>${joinCard(240, false)}</div><p class="status" style="margin:0;align-self:center;font-size:1.05rem">Kaptanlar şimdiden QR kodu okutabilir ya da adrese girip şifreyi yazabilir. Kura bitince telefonlarında kendi sınıflarını seçecekler.</p></div>` : ''}
      ${n < 4 ? `<div class="notice">Kura için en az 4 sınıf gerekir. Sınıf listesini Ayarlar ekranından düzenleyin.</div>` : ''}
      <div class="row end"><button class="btn primary big" data-act="drawGo" ${n<4?'disabled':''}>Kurayı Çek</button></div>
    </div>`;
  }
  const seq = drawSeq(g.draw), shown = ui.drawShown == null ? seq.length : ui.drawShown;
  const vis = new Set(seq.slice(0, shown).map(x=>x.join(':')));
  const lastKey = shown > 0 && shown <= seq.length ? seq[shown-1].join(':') : '';
  const col = (k, title) => `<div class="dcol"><h3>${title}</h3>${g.draw[k].map((c,i)=>{
      const kk = k+':'+i; return vis.has(kk) ? `<div class="dtile ${ui.drawShown!=null && kk===lastKey?'new':''}">${esc(c)}<span>${i+1}. sıra</span></div>` : `<div class="dtile wait">?</div>`; }).join('')}</div>`;
  const done = shown >= seq.length;
  return `<div class="center-card">
    <div class="board-h"><h2>Kura</h2><span>${done?'Kura tamamlandı':'Kura çekiliyor…'}</span></div>
    ${done ? '' : `<div class="drum" id="drum">?</div>`}
    <div class="draw-cols">${col('s1','1. Etap')}${col('s2','2. Etap')}</div>
    ${done ? `<div class="row"><button class="btn ghost" data-act="redrawAsk">Kurayı Yeniden Çek</button><span class="spacer"></span><button class="btn primary big" data-act="drawOk">Onayla ve 1. Etaba Geç</button></div>` : ''}
    ${confirmBox('redraw','Kura sonucu silinip yeniden çekilecek. Emin misiniz?','redrawYes','Yeniden Çek')}
  </div>`;
}

function joinCard(size, withIpSel){
  const g = G(), base = joinBase();
  if (!NET.ok) return `<div class="notice">QR kod ve şifre şu an kapalı, çünkü program doğrudan açıldı. Kapatın ve klasördeki <b>BASLAT</b> dosyasına çift tıklayarak açın; QR kod ve şifre burada görünecek.</div>`;
  if (!base) return `<div class="notice">Bilgisayarın ağ adresi bulunamadı. Bilgisayarı Wi-Fi'ye bağlayın ya da bir telefondan kişisel erişim noktası açıp ona bağlayın, sonra sayfayı yenileyin.</div>`;
  const ips = NET.ips || [], addr = base.replace(/^https?:\/\//,'').replace(/\/$/,'');
  return `<div class="joinbox"><small>1. YOL · Telefon kamerasıyla okut</small><div class="qr" data-size="${size}" data-url="${esc(base+'?pin='+g.pin)}" style="width:${size}px;height:${size}px"></div>
    <small>2. YOL · Tarayıcıya bu adresi yaz</small><div class="url" style="font-weight:800;font-size:1.25rem;color:#111">${esc(addr)}</div>
    <small>sonra şifreyi gir</small><div class="pin">${g.pin}</div></div>
    ${withIpSel && ips.length > 1 ? `<div class="fld" style="margin-top:10px"><label for="ip-sel">Ağ adresi (telefonlar bağlanamazsa diğerini deneyin)</label><select class="field" id="ip-sel">${ips.map(ip=>`<option ${ip===lanIp()?'selected':''}>${ip}</option>`).join('')}</select></div>` : ''}`;
}

function vQuestion(){
  const g = G(), key = stageKey(), qs = S.questions[key], q = qs[g.qIndex], teams = g.teams[key];
  if (!q) return `<div class="notice">Soru bulunamadı. Soru Yönetimi ekranını kontrol edin.</div>`;
  if (!g.shown){
    return `${teamChips(teams)}
    <div class="center-card" style="align-items:center;text-align:center;gap:22px;padding-block:40px">
      <div class="qhead" style="justify-content:center;margin:0"><span class="tag ${q.type==='tahmin'?'tahmin':''}" style="font-size:1.3rem">${qLabel(q)}</span><span class="qnum" style="font-size:1.3rem">Soru ${g.qIndex+1} / ${qs.length}</span></div>
      <h2 style="font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,6vw,4.5rem);color:var(--accent)">Hazır mısınız?</h2>
      <p class="status" style="margin:0;font-size:1.1rem">Soru ekrana ve telefonlara gelecek, ${S.settings.seconds} saniyelik süre hemen başlayacak.</p>
      <button class="btn primary big" data-act="showQ" style="font-size:1.6rem;padding:.8em 2em">Soruyu Göster <kbd>Enter</kbd></button>
    </div>`;
  }
  let body;
  if (q.type === 'ders'){
    body = `<div class="opts">${q.options.map((o,i)=>{
      const L = LETTERS[i], cls = g.revealed ? (L === q.answer ? 'correct' : 'dim') : '';
      return `<div class="opt ${cls}" style="--k:${KCOL[i]}"><span class="L">${L}</span><span>${esc(o)}</span></div>`; }).join('')}</div>`;
  } else {
    body = g.revealed
      ? `<div class="reveal-num"><small>Doğru cevap</small><b>${fmt(q.answer)}</b><i>${esc(q.unit)}</i></div>`
      : `<div class="guess-hint">Tahmininizi yazın! Gerçek cevaba <b>en yakın</b> sınıf 10 puan alır.</div>`;
  }
  let panel = '';
  if (g.revealed){
    const auto = NET.ok ? ' Telefondan gelen cevaplara göre otomatik dolduruldu; gerekirse değiştirin.' : '';

      panel = `${autoNote()}<div class="panel"><h3>Doğru bilen sınıflar</h3>
        <div class="pick">${teams.map((t,i)=>`<button style="--c:${tcol(i)}" class="${ui.sel.includes(i)?'on':''}" data-act="toggleTeam" data-i="${i}"><span>${esc(t.name)}</span><b class="mark">+10</b></button>`).join('')}</div>
        <p class="note">Doğru bilenleri işaretleyin. Hiçbir sınıf bilemediyse seçmeden kaydedin.${auto}</p>
        <div class="row end"><button class="btn primary big" data-act="saveScore">Puanları Kaydet</button></div></div>`;

      panel = `${autoNote()}<div class="panel"><h3>Tahminler</h3>
        <div class="guesses">${teams.map((t,i)=>`<div class="guess" style="--c:${tcol(i)}"><label for="g-${i}">${esc(t.name)}</label>
          <input class="field" id="g-${i}" data-guess="${i}" inputmode="decimal" autocomplete="off" value="${esc(ui.guesses[i]||'')}" placeholder="Tahmin"></div>`).join('')}</div>
        <p class="note">Ondalık için virgül kullanın (42,195). Boş bırakılan sınıf cevap vermemiş sayılır.${auto}</p>
        <div class="row end"><button class="btn primary big" data-act="saveScore">En Yakını Bul ve Puanla</button></div></div>`;
    }
  }
  return `${teamChips(teams)}
    ${NET.ok ? `<div class="ans-strip" id="ans-strip"></div>` : ''}
    <div class="qwrap">
      <section>
        <div class="qhead"><span class="tag ${q.type==='tahmin'?'tahmin':''}">${qLabel(q)}</span><span class="qnum">Soru ${g.qIndex+1} / ${qs.length}</span></div>
        <p class="qtext">${esc(q.text)}</p>
        ${body}
      </section>
      <aside class="side">${dialHTML()}
        <div class="btns">
          <button class="btn primary" id="tbtn" data-act="timer">Süreyi Başlat</button>
          <button class="btn" data-act="timerReset">Süreyi Sıfırla</button>
          ${g.revealed ? '' : `<button class="btn" data-act="reveal">Cevabı Göster <kbd>Enter</kbd></button>`}
        </div>
      </aside>
    </div>
    ${panel}`;
}

function vScore(){
  const g = G(), key = stageKey(), teams = g.teams[key], n = S.questions[key].length;
  const max = Math.max(10, n*10);
  const order = teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score);
  const last = g.last || {winners:[]};
  let table = '';
  if (last.detail){
    table = `<div class="panel"><h3>Tahminler · doğru cevap ${fmt(last.answer)} ${esc(last.unit||'')}</h3><div class="tscroll"><table class="gtable">
      <thead><tr><th>Sınıf</th><th>Tahmin</th><th>Fark</th></tr></thead><tbody>
      ${teams.map((t,i)=>{ const gv = last.detail.guesses[i], dv = last.detail.dists[i];
        return `<tr class="${last.winners.includes(i)?'win':''}"><td>${esc(t.name)}</td><td>${gv==null?'—':fmt(gv)}</td><td>${dv==null?'—':fmt(dv)}</td></tr>`; }).join('')}
      </tbody></table></div></div>`;
  }
  const isLast = g.qIndex + 1 >= n;
  return `<div class="center-card">
    <div class="board-h"><h2>Puan Durumu</h2><span>Soru ${g.qIndex+1} / ${n} sonrası${last.winners.length?'':' · bu soruda puan alan olmadı'}</span></div>
    <div class="bars">${order.map((o,r)=>`<div class="bar" style="--c:${tcol(o.i)}"><div class="fill" data-w="${Math.min(100, o.t.score/max*100)}"></div>
      <div class="rk">${r+1}</div><div class="nm"><span>${esc(o.t.name)}</span>${last.winners.includes(o.i)?'<span class="plus">+10</span>':''}</div>
      <div class="pts">${ui.scoreEdit?`<button class="btn small" data-act="adj" data-i="${o.i}" data-v="-10">−10</button>`:''}${o.t.score}${ui.scoreEdit?`<button class="btn small" data-act="adj" data-i="${o.i}" data-v="10">+10</button>`:''}</div></div>`).join('')}</div>
    ${nextNote(isLast)}
    ${table}
    <div class="row">
      <button class="btn" data-act="undo" ${g.history.length?'':'disabled'}>Geri Al</button>
      <button class="btn ghost" data-act="scoreEdit">${ui.scoreEdit?'Düzeltmeyi Bitir':'Puanları Düzelt'}</button>
      <span class="spacer"></span>
      <button class="btn primary big" data-act="next">${isLast?'Etap Sonucunu Göster':'Sonraki Soru'} <kbd>→</kbd></button>
    </div>
  </div>`;
}

function vStageEnd(){
  const g = G(), st = STAGES[g.stage], key = st.key, teams = g.teams[key], r = g.result;
  const isFinal = key === 'final';
  const order = teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score);
  const tieSet = r.tie ? r.tie.candidates : [];
  const rows = order.map((o,k)=>{
    const q = r.qualified.includes(o.i), tie = tieSet.includes(o.i);
    const badge = q ? `<span class="badge">${isFinal?'ŞAMPİYON':'FİNALDE'}</span>` : tie ? `<span class="badge tie">EŞİTLİK</span>` : '';
    return `<div class="bar ${!q && !tie && !r.tie ? 'out':''}" style="--c:${tcol(o.i)}"><div class="fill" data-w="${Math.min(100,o.t.score/Math.max(10,S.questions[key].length*10)*100)}"></div>
      <div class="rk">${k+1}</div><div class="nm"><span>${esc(o.t.name)}</span>${badge}</div><div class="pts">${o.t.score}</div></div>`;
  }).join('');
  let box, btn;
  if (r.tie){
    const names = r.tie.candidates.map(i=>`<b>${esc(teams[i].name)}</b>`).join(', ');
    const what = isFinal ? 'şampiyonluk' : (r.tie.slots === 1 ? 'son final yeri' : `${r.tie.slots} final yeri`);
    box = `<div class="notice">Eşitlik var! ${names} sınıfları ${what} için eşit puanda. Ek bir tahmin sorusu sorulacak; gerçek cevaba en yakın sınıf kazanır.</div>`;
    btn = `<button class="btn primary big" data-act="startTie">Eşitlik Sorusuna Geç</button>`;
  } else if (isFinal){
    box = `<div class="notice ok">Şampiyon belli oldu: <b>${esc(teams[r.qualified[0]].name)}</b>${r.tieNote?` · ${esc(r.tieNote)}`:''}</div>`;
    btn = `<button class="btn primary big" data-act="advance">Şampiyonu Göster</button>`;
  } else {
    box = `<div class="notice ok">Finale çıkan sınıflar: ${r.qualified.map(i=>`<b>${esc(teams[i].name)}</b>`).join(' ve ')}${r.tieNote?` · ${esc(r.tieNote)}`:''}</div>`;
    btn = `<button class="btn primary big" data-act="advance">${g.stage===0?'2. Etaba Geç':'Finale Geç'}</button>`;
  }
  return `<div class="center-card">
    <div class="board-h"><h2>${isFinal?'Final Sonuçları':st.name+' Tamamlandı'}</h2></div>
    <div class="bars">${rows}</div>${box}
    <div class="row"><button class="btn" data-act="undo" ${g.history.length?'':'disabled'}>Geri Al</button><span class="spacer"></span>${btn}</div>
  </div>`;
}

function vTie(){
  const g = G(), key = stageKey(), teams = g.teams[key], t = g.tie;
  const q = S.questions.tie[t.poolIdx];
  const cands = t.candidates;
  let qPart;
  if (q){
    qPart = `<div class="qhead"><span class="tag tahmin">Eşitlik Sorusu</span><span class="qnum">${cands.map(i=>esc(teams[i].name)).join(' · ')}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      ${t.revealed ? `<div class="reveal-num"><small>Doğru cevap</small><b>${fmt(q.answer)}</b><i>${esc(q.unit)}</i></div>` : `<div class="guess-hint">Tahmininizi yazın! Gerçek cevaba en yakın sınıf kazanır.</div>`}`;
  } else {
    qPart = `<div class="qhead"><span class="tag tahmin">Eşitlik Sorusu</span></div>
      <div class="notice">Yedek eşitlik sorusu kalmadı. Sözlü bir tahmin sorusu sorun ve doğru cevabı aşağıya yazın. (Soru Yönetimi › Eşitlik sekmesinden yedek soru ekleyebilirsiniz.)</div>
      <div class="fld"><label for="tie-ans">Doğru cevap</label><input class="field" id="tie-ans" inputmode="decimal" value="${esc(ui.tieAns)}" placeholder="Örneğin 1453"></div>`;
  }
  const showInputs = t.revealed || !q;

/* ---------- render (host) ---------- */
const $app = document.getElementById('app');
function render(){
  const s = ui.screen;
  $app.innerHTML = (s==='menu' ? vMenu() : s==='manage' ? vManage() : s==='settings' ? vSettings() : vGame())
    + (ui.msg ? `<div class="toast" role="status">${esc(ui.msg)}</div>` : '');
  paintTimer();
  requestAnimationFrame(()=>document.querySelectorAll('.fill[data-w]').forEach(el=>el.style.width = el.dataset.w + '%'));
  document.querySelectorAll('.qr[data-url]').forEach(qr=>{
    try{
      const size = +qr.dataset.size || 300;
      const q = new QRLIB.QRCode(-1, QRLIB.ECL.M); q.addData(qr.dataset.url); q.make();
      const n = q.getModuleCount(), m = 4, cell = Math.max(2, Math.floor(size / (n + 2*m)));
      const cv = document.createElement('canvas'); cv.width = cv.height = cell * (n + 2*m);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.fillStyle = '#000';
      for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) cx.fillRect((c+m)*cell, (r+m)*cell, cell, cell);
      cv.setAttribute('role','img'); cv.setAttribute('aria-label','Katılım QR kodu'); cv.style.width = size + 'px'; cv.style.maxWidth = '100%'; cv.style.imageRendering = 'pixelated';
      qr.appendChild(cv);
    }catch(e){ qr.innerHTML = '<small>QR kod oluşturulamadı; şifreyle girin.</small>'; }
  });
  if (ui.screen === 'game'){ netWatch(); paintJoined(); paintAnswers(); }
}

function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'); cv.hidden = false;
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#ff9f1c','#ff5d8f','#36c5f0','#8be04e','#ffe14d','#b58cff'];
  const P = Array.from({length:180}, ()=>({x:Math.random()*W, y:-20-Math.random()*H*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, w:6+Math.random()*8, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); ctx.restore(); });
    if (t - t0 < 6500) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  })(t0);
}

/* ---------- actions (host) ---------- */
function goQuestion(){ autoCancel(); const g = G(); g.revealed = false; g.shown = true; g.view = 'question'; ui.sel = []; ui.guesses = {}; ui.touched = false; resetTimer(); startTimer(); }
function finishStage(){
  const g = G(), key = stageKey(), teams = g.teams[key];
  g.result = cutoff(teams.map((t,i)=>({i, score:t.score})), key==='final' ? 1 : 2);
  g.view = 'stageEnd';
}
function runDrawAnim(){
  const g = G(), seq = drawSeq(g.draw), all = S.settings.classes;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ ui.drawShown = null; save(); render(); return; }
  ui.drawShown = 0; render();
  clearInterval(ui.drumH); clearInterval(ui.drawH);
  ui.drumH = setInterval(()=>{ const d = document.getElementById('drum'); if (d) d.textContent = all[rand(all.length)]; }, 70);
  ui.drawH = setInterval(()=>{
    ui.drawShown++; beep(660,.12);
    if (ui.drawShown >= seq.length){ clearInterval(ui.drawH); clearInterval(ui.drumH); ui.drawShown = null; beep(880,.3); save(); }
    render();
  }, 1100);
}
const ACT = {
  cancel(){ ui.confirm = null; render(); },
  menu(){ nextCancel(); autoCancel(); stopTimer(); sync(); ui.screen='menu'; ui.confirm=null; ui.edit=null; render(); },
  manage(){ stopTimer(); sync(); ui.screen='manage'; ui.confirm=null; render(); },
  settings(){ ui.screen='settings'; ui.confirm=null; render(); },
  fs(){ try{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('Tam ekran bu ortamda açılamadı.')); }catch(e){ toast('Tam ekran bu ortamda açılamadı.'); } },
  start(){ ui.screen='game'; render(); },
  newGameAsk(){ ui.confirm='newgame'; render(); },
  newGameYes(){
    S.game = newGame(); S.game.started = true; ui.confirm=null; ui.screen='game'; ui.drawShown = null; resetTimer();
    if (NET.ok){ try{ NET.db.ref('games/'+S.game.pin+'/meta').set({created:TS(), title:S.settings.title}); }catch(e){} }
    save(); render();
  },
  drawGo(){
    const g = G(), sh = shuffle(S.settings.classes), n1 = Math.ceil(sh.length/2);
    g.draw = {s1: sh.slice(0,n1), s2: sh.slice(n1)};
    save(); runDrawAnim();
  },
  redrawAsk(){ ui.confirm = 'redraw'; render(); },
  redrawYes(){ ui.confirm = null; ACT.drawGo(); },
  drawOk(){
    const g = G();
    g.teams.s1 = g.draw.s1.map(n=>({name:n, score:0}));
    g.teams.s2 = g.draw.s2.map(n=>({name:n, score:0}));
    g.stage = 0; g.view = 'teams'; save(); render();
  },
  startStage(){
    const g = G(), key = stageKey();
    if (!S.questions[key].length) return toast('Bu etapta soru yok.');
    g.teams[key].forEach(t=>t.score = 0);
    g.qIndex = 0; g.result = null; g.tie = null; g.last = null; g.history = [];
    goQuestion(); save(); render();
  },
  timer(){ toggleTimer(); },
  timerReset(){ resetTimer(); },
  showQ(){ const g = G(); if (g.view!=='question' || g.shown) return; g.shown = true; resetTimer(); startTimer(); save(); render(); },
  reveal(){ const g = G(); if (g.view!=='question' || g.revealed || !g.shown) return; g.revealed = true; stopTimer(); ui.touched = false; prefill(); save(); render(); },
  toggleTeam(d){ const i = +d.i; ui.touched = true; if (ui.autoLeft != null) autoCancel(); ui.sel = ui.sel.includes(i) ? ui.sel.filter(x=>x!==i) : [...ui.sel, i]; render(); },
  saveScore(){
    const g = G(), key = stageKey(), q = S.questions[key][g.qIndex], teams = g.teams[key];
    let winners = [], detail = null;
    if (q.type === 'ders'){ winners = [...ui.sel].sort((a,b)=>a-b); }
    else {
      const guesses = teams.map((t,i)=>parseNum(ui.guesses[i]));
      const bad = teams.findIndex((t,i)=> String(ui.guesses[i]||'').trim() && guesses[i]==null);
      if (bad >= 0) return toast(`${teams[bad].name} için geçerli bir sayı girin.`);
      const dists = guesses.map(v=> v==null ? null : Math.round(Math.abs(v - q.answer)*1e6)/1e6);
      const valid = dists.filter(x=>x!=null);
      if (valid.length){ const m = Math.min(...valid); winners = dists.map((x,i)=>x===m?i:-1).filter(i=>i>=0); }
      detail = {guesses, dists};
    }
    pushHistory();
    winners.forEach(i=>teams[i].score += 10);
    g.last = {winners, detail, answer:q.answer, unit:q.unit};
    g.view = 'scoreboard'; ui.scoreEdit = false; stopTimer(); save(); autoNext(); render();
  },
  undo(){
    nextCancel(); const g = G(); if (!g.history.length) return;
    const h = g.history.slice(0,-1), snap = JSON.parse(g.history[g.history.length-1]);
    S.game = Object.assign(snap, {history:h}); ui.sel = []; ui.guesses = {}; ui.scoreEdit = false; ui.touched = false;
    if (S.game.view === 'question' || S.game.view === 'tie') resetTimer();
    prefill(); save(); render(); toast('Son işlem geri alındı.');
  },
  scoreEdit(){ nextCancel(); ui.scoreEdit = !ui.scoreEdit; render(); },
  adj(d){ const g = G(), t = g.teams[stageKey()][+d.i]; pushHistory(); t.score = Math.max(0, t.score + (+d.v)); save(); render(); },
  next(){
    nextCancel(); const g = G(); if (g.view !== 'scoreboard') return;
    if (g.qIndex + 1 < S.questions[stageKey()].length){ g.qIndex++; goQuestion(); }
    else finishStage();
    save(); render();
  },
  startTie(){
    const g = G(); const r = g.result;
    g.tieRound = (g.tieRound||0) + 1;
    g.tie = {candidates:r.tie.candidates, slots:r.tie.slots, poolIdx:g.tieUsed, revealed:false};
    g.view = 'tie'; ui.guesses = {}; ui.tieAns = ''; ui.touched = false; resetTimer(); startTimer(); save(); render();
  },
  tieReveal(){ const g = G(); if (g.view!=='tie' || g.tie.revealed) return; g.tie.revealed = true; stopTimer(); ui.touched = false; prefill(); save(); render(); },
  resolveTie(){
    const g = G(), t = g.tie, key = stageKey(), teams = g.teams[key];
    const q = S.questions.tie[t.poolIdx];
    const ans = q ? q.answer : parseNum(document.getElementById('tie-ans')?.value);
    if (ans == null) return toast('Önce doğru cevabı girin.');
    const scores = t.candidates.map(i=>{ const v = parseNum(ui.guesses[i]); return {i, score: v==null ? -Infinity : -Math.round(Math.abs(v-ans)*1e6)/1e6}; });
    if (scores.every(s=>s.score===-Infinity)) return toast('En az bir sınıfın tahminini girin.');
    pushHistory();
    if (q) g.tieUsed = Math.max(g.tieUsed, t.poolIdx + 1);
    const res = cutoff(scores, t.slots);
    const detail = t.candidates.map(i=>`${teams[i].name}: ${ui.guesses[i]?fmt(parseNum(ui.guesses[i])):'—'}`).join(', ');
    g.result.qualified = g.result.qualified.concat(res.qualified);
    ui.guesses = {}; ui.tieAns = ''; ui.touched = false;
    if (res.tie){
      g.tieRound = (g.tieRound||0) + 1;
      g.tie = {candidates:res.tie.candidates, slots:res.tie.slots, poolIdx:g.tieUsed, revealed:false};
      resetTimer(); startTimer(); save(); render(); toast('Yine eşitlik! Yeni bir eşitlik sorusu soruluyor.');
    } else {
      g.result.tie = null;
      g.result.tieNote = `Eşitlik sorusunu ${res.qualified.map(i=>teams[i].name).join(' ve ')} kazandı (cevap ${fmt(ans)}; ${detail})`;
      g.tie = null; g.view = 'stageEnd'; stopTimer(); save(); render();
    }
  },
  advance(){
    const g = G(), st = STAGES[g.stage], key = st.key, teams = g.teams[key];
    if (key !== 'final'){
      g.qualified[key] = g.result.qualified.map(i=>({name:teams[i].name, from:st.name}));
      g.stage++; g.history = []; g.result = null; g.view = 'teams';
      if (g.stage === 2) g.teams.final = [...g.qualified.s1, ...g.qualified.s2].map(t=>({name:t.name, from:t.from, score:0}));
      save(); render();
    } else {
      g.view = 'champion'; g.finished = true; save(); render(); beep(523,.15); setTimeout(()=>beep(659,.15),160); setTimeout(()=>beep(784,.4),320); confetti();
    }
  },

  tab(d){ ui.tab = d.k; ui.confirm = null; render(); },
  addQ(d){ ui.edit = d.t === 'ders' ? {id:null, type:'ders', subject:SUBJECTS[0], text:'', options:['','','',''], answer:'A'} : {id:null, type:'tahmin', text:'', answer:'', unit:''}; render(); document.getElementById('e-text')?.focus(); },
  editQ(d){ const q = S.questions[ui.tab].find(x=>x.id===d.id); if (!q) return; ui.edit = JSON.parse(JSON.stringify(q)); render(); },
  closeEdit(){ ui.edit = null; render(); },

    if (e.type === 'ders'){
      const options = [0,1,2,3].map(i=>v('e-opt-'+i).trim());
      if (options.some(o=>!o)) return toast('Dört şıkkın hepsini doldurun.');

  delYes(d){ S.questions[ui.tab] = S.questions[ui.tab].filter(q=>q.id!==d.id); ui.confirm = null; save(); render(); toast('Soru silindi.'); },
  move(d){ const l = S.questions[ui.tab], i = l.findIndex(q=>q.id===d.id), j = i + (+d.d); if (j<0||j>=l.length) return; [l[i],l[j]] = [l[j],l[i]]; save(); render(); },
  exportData(){ ui.backup = JSON.stringify({app:'kaplan-arena', version:1, settings:S.settings, questions:S.questions}, null, 2); render(); },
  copyBackup(){

  },
  downloadBackup(){
    try{

  importAsk(){

    if (!(sec >= 5 && sec <= 600)) return toast('Süre 5 ile 600 saniye arasında olmalı.');
    const classes = document.getElementById('set-classes').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    if (new Set(classes).size !== classes.length) return toast('Sınıf listesinde aynı isim iki kez geçiyor.');
    if (classes.length < 4) return toast('En az 4 sınıf girin.');
    S.settings.title = title; S.settings.seconds = sec; S.settings.sound = document.getElementById('set-sound').checked;

  resetAllAsk(){ ui.confirm = 'resetall'; render(); },
  resetAllYes(){ S = defaultState(); ui.confirm = null; TM.left = S.settings.seconds; save(); render(); toast('Tüm veriler sıfırlandı.'); },
};

function validateImport(o){
  if (!o || typeof o !== 'object' || !o.questions) throw new Error('soru listesi bulunamadı');
  const out = {};
  for (const k of ['s1','s2','final','tie']){
    const arr = Array.isArray(o.questions[k]) ? o.questions[k] : [];
    out[k] = arr.map((q,ix)=>{
      if (!q || !q.text) throw new Error(`${k} bölümünde ${ix+1}. sorunun metni yok`);
      if (q.type === 'ders'){
        if (!Array.isArray(q.options) || q.options.length !== 4 || !LETTERS.includes(q.answer)) throw new Error(`${k} bölümünde ${ix+1}. sorunun şıkları hatalı`);
        return {id:uid(), type:'ders', subject:SUBJECTS.includes(q.subject)?q.subject:SUBJECTS[0], text:String(q.text), options:q.options.map(String), answer:q.answer};
      }
      const n = typeof q.answer === 'number' ? q.answer : parseNum(q.answer);
      if (n == null) throw new Error(`${k} bölümünde ${ix+1}. tahmin sorusunun cevabı sayı değil`);
      return {id:uid(), type:'tahmin', text:String(q.text), answer:n, unit:String(q.unit||'')};
    });
  }
  let settings = null;
  if (o.settings && typeof o.settings === 'object'){
    settings = {};
    if (typeof o.settings.title === 'string') settings.title = o.settings.title;
    if (Number(o.settings.seconds) >= 5) settings.seconds = Math.round(o.settings.seconds);
    if (Array.isArray(o.settings.classes) && o.settings.classes.length >= 4) settings.classes = o.settings.classes.map(String);
  }
  return {questions:out, settings};
}

function hostInit(){
  S = load() || defaultState();
  ui = { screen:'menu', tab:'s1', edit:null, confirm:null, backup:'', importText:'', msg:'', sel:[], guesses:{}, scoreEdit:false, tieAns:'', touched:false, drawShown:null };
  TM = { left:S.settings.seconds, running:false, h:null, end:0, endServer:0 };
  netInit().then(ok=>{ if (ok){ render(); sync(); } });
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act]; if (!fn) return;
    initAudio(); fn(b.dataset, b, e);
    if (b.tagName === 'BUTTON' && document.activeElement === b) b.blur();
  });
  document.addEventListener('input', e=>{
    const t = e.target;
    if (t.dataset && t.dataset.guess != null){ ui.guesses[t.dataset.guess] = t.value; ui.touched = true; if (ui.autoLeft != null){ autoCancel(); const n = document.getElementById('auto-note'); if (n) n.remove(); } }
    if (t.id === 'imp-text') ui.importText = t.value;
    if (t.id === 'tie-ans') ui.tieAns = t.value;
  });
  document.addEventListener('change', e=>{
    if (e.target.id === 'ip-sel'){ S.settings.lanIp = e.target.value; save(); render(); return; }
    if (e.target.id !== 'imp-file') return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { ui.importText = String(rd.result || ''); render(); toast('Dosya okundu. "İçe Aktar" ile yükleyin.'); };
    rd.onerror = () => toast('Dosya okunamadı.');
    rd.readAsText(f);
  });
  document.addEventListener('keydown', e=>{
    if (e.key === 'Escape' && (ui.edit || ui.joinOpen)){ ui.edit = null; ui.joinOpen = false; render(); return; }
    if (e.target.closest && e.target.closest('input,textarea,select')){
      if (e.key === 'Enter' && e.target.dataset && e.target.dataset.guess != null){
        const all = [...document.querySelectorAll('[data-guess]')]; const i = all.indexOf(e.target);
        if (i >= 0 && i < all.length-1){ e.preventDefault(); all[i+1].focus(); }
      }
      return;
    }
    if (ui.screen !== 'game') return;
    const g = G();
    if (e.code === 'Space'){ if ((g.view==='question' && g.shown) || g.view==='tie'){ e.preventDefault(); initAudio(); toggleTimer(); } }
    else if (e.key === 'Enter'){
      if (e.target.closest && e.target.closest('button')) return;
      if (g.view==='question'){ if (!g.shown) ACT.showQ(); else ACT.reveal(); } else if (g.view==='tie') ACT.tieReveal();
    }
    else if (e.key === 'ArrowRight'){ if (g.view==='scoreboard') ACT.next(); }
    else if (e.key === 'f' || e.key === 'F'){ ACT.fs(); }
  });
  render();
  sync();
}

const P = { pin:'', team:null, dev:'', st:null, view:'pin', err:'', players:{}, ans:null, ansRef:null, ansQk:null, ansIdx:-1,
            stateRef:null, plRef:null, plStage:null, claimedFor:null, confirmPick:null, draft:'', locked:false, lastQk:null };
function plLoad(){
  try{ const o = JSON.parse(localStorage.getItem('ka-player') || 'null'); if (o){ P.pin = o.pin || ''; P.team = o.team || null; } }catch(e){}
  try{ P.dev = localStorage.getItem('ka-dev') || ''; if (!P.dev){ P.dev = uid()+uid(); localStorage.setItem('ka-dev', P.dev); } }catch(e){ P.dev = uid()+uid(); }
}
function plSave(){ try{ localStorage.setItem('ka-player', JSON.stringify({pin:P.pin, team:P.team})); }catch(e){} }
function myIdx(){ return P.st && P.team ? (P.st.teams || []).indexOf(P.team) : -1; }
function plJoin(pin){
  pin = String(pin || '').replace(/\D/g,'');
  if (pin.length !== 6){ P.err = '6 haneli şifreyi girin.'; P.view = 'pin'; return plRender(); }
  P.err = ''; P.view = 'loading'; plRender();
  NET.db.ref('games/'+pin+'/state').once('value').then(s=>{
    if (!s.exists()){ P.err = 'Bu şifreyle açık bir yarışma bulunamadı. Şifreyi kontrol edin.'; P.view = 'pin'; return plRender(); }
    if (P.pin !== pin){ P.team = null; }
    P.pin = pin; plSave(); P.view = 'game';
    if (P.stateRef) P.stateRef.off();
    P.stateRef = NET.db.ref('games/'+pin+'/state');
    P.stateRef.on('value', snap=>{ P.st = snap.val(); plOnState(); });
  }).catch(()=>{ P.err = 'Bağlantı kurulamadı. Aynı Wi-Fi ağında olduğunuzu kontrol edip tekrar deneyin.'; P.view = 'pin'; plRender(); });
}
function plOnState(){
  const st = P.st; if (!st) return plRender();
  if (P.plStage !== st.stage){
    if (P.plRef) P.plRef.off();
    P.plStage = st.stage; P.players = {};
    P.plRef = NET.db.ref(`games/${P.pin}/players/${st.stage}`);
    P.plRef.on('value', s=>{ P.players = s.val() || {}; plRender(); });
  }
  const i = myIdx();
  if (i >= 0 && P.claimedFor !== st.stage + ':' + i){
    P.claimedFor = st.stage + ':' + i;
    NET.db.ref(`games/${P.pin}/players/${st.stage}/${i}`).set({dev:P.dev, t:TS()}).catch(()=>{});
  }
  const qk = st.qk || null;
  if (P.ansQk !== qk || P.ansIdx !== i){
    if (P.ansRef) P.ansRef.off();
    P.ans = null; P.ansQk = qk; P.ansIdx = i; P.ansRef = null;
    if (qk && i >= 0){ P.ansRef = NET.db.ref(`games/${P.pin}/answers/${qk}/${i}`); P.ansRef.on('value', s=>{ P.ans = s.val(); plRender(); }); }
  }
  if (P.lastQk !== qk){ P.lastQk = qk; P.draft = ''; }
  plRender();
}
function plLeft(){ const st = P.st; if (!st || !st.open || !st.deadline) return null; return Math.max(0, Math.ceil((st.deadline - nowS())/1000)); }
function plCanAnswer(){
  const st = P.st, i = myIdx();
  if (!st || i < 0 || (st.v !== 'question' && st.v !== 'tie') || !st.q) return false;
  if (st.revealed || st.timeUp) return false;
  if (st.eligible && !st.eligible.includes(i)) return false;
  const l = plLeft(); if (l === 0) return false;
  return true;
}
function plSend(v, raw){
  if (!plCanAnswer()) return;
  const i = myIdx();
  NET.db.ref(`games/${P.pin}/answers/${P.st.qk}/${i}`).set({v, raw:raw==null?String(v):raw, dev:P.dev, t:TS()})
    .catch(()=>{ P.err = 'Cevap gönderilemedi. Wi-Fi bağlantınızı kontrol edin.'; plRender(); });
}
function plTop(){
  const st = P.st, i = myIdx();
  const me = i >= 0 ? `<span class="me" style="--c:${tcol(i)}">${esc(P.team)}</span><span class="pts">${st.scores ? st.scores[i] : 0}</span>` : '';
  return `<div class="pl-top"><span class="brand">${esc(st ? st.title : 'Kaplan Arena')}</span>${me}</div>`;
}
function plRender(){
  const app = document.getElementById('app');
  let h = '';
  if (P.view === 'nonet'){
    h = `<div class="pl"><div class="pl-hero"><h1>Kaplan Arena</h1></div><div class="pl-card big bad"><h2>Bağlanılamıyor</h2><p>Telefonunuzun, yarışma bilgisayarıyla aynı Wi-Fi ağına bağlı olduğundan emin olup sayfayı yenileyin.</p></div></div>`;
  } else if (P.view === 'pin' || P.view === 'loading'){
    h = `<div class="pl"><div class="pl-hero"><h1>Kaplan Arena</h1><p>Ekrandaki 6 haneli şifreyi yazın</p>
      <input class="pinput" id="pl-pin" inputmode="numeric" autocomplete="off" maxlength="6" value="${esc(P.pin)}" placeholder="••••••">
      ${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
      <button class="btn primary big" data-pl="join" ${P.view==='loading'?'disabled':''} style="width:100%;max-width:320px">${P.view==='loading'?'Bağlanıyor…':'Katıl'}</button></div></div>`;
  } else {
    h = `<div class="pl">${plTop()}${plBody()}${P.err?`<div class="err">${esc(P.err)}</div>`:''}</div>`;
  }
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  app.innerHTML = h;
  if (active){ const el = document.getElementById(active); if (el){ el.focus(); try{ if (caret!=null) el.setSelectionRange(caret, caret); }catch(e){} } }
  plTickPaint();
}
function plPick(){
  const st = P.st, joinedBy = i => P.players && P.players[i];
  return `<div class="pl-card"><h3>Sınıfını seç</h3><p class="status" style="margin:0">${esc(st.stageName)} şu an bu sınıflarla oynanıyor. Sınıfının kaptanıysan sınıfını seç.</p>
    <div class="plist">${(st.teams||[]).map((n,i)=>{ const j = joinedBy(i), taken = j && j.dev !== P.dev;
      return `<button style="--c:${tcol(i)}" class="${taken?'taken':''}" data-pl="pick" data-i="${i}">${esc(n)}<em>${taken?'Başka telefon bağlı':'Seçmek için dokun'}</em></button>`; }).join('')}</div>
    ${P.confirmPick != null ? `<div class="confirm"><p><b>${esc(st.teams[P.confirmPick])}</b> sınıfına başka bir telefon bağlı. Kaptan sizseniz bu telefonla devam edin.</p><button class="btn primary" data-pl="pickYes">Bu telefonla devam et</button><button class="btn" data-pl="pickNo">Vazgeç</button></div>` : ''}
    ${P.team ? `<p class="status" style="margin:0">${esc(P.team)} bu etapta yarışmıyor. İzlemeye devam edebilirsiniz.</p>` : ''}
  </div>`;
}
function plBody(){
  const st = P.st, i = myIdx();
  if (!st) return `<div class="pl-card big"><h2>Bekleniyor…</h2></div>`;
  if (st.v === 'draw'){
    return `<div class="pl-card big"><h2>Kura çekiliyor</h2><p>Sınıflar etaplara dağıtılıyor. Ekranı takip edin.</p></div>
      ${st.draw ? `<div class="pl-card"><b>1. Etap:</b> ${st.draw.s1.map(esc).join(', ')}<br><b>2. Etap:</b> ${st.draw.s2.map(esc).join(', ')}</div>` : ''}`;
  }
  if (st.v === 'ended'){
    return `<div class="pl-card big"><h2>Yarışma sona erdi</h2><p>${esc(st.title)} bitti. Katıldığınız için teşekkürler!</p></div>`;
  }
  if (st.v === 'champion'){
    const champ = st.teams[st.champ];
    return `<div class="pl-card big ${i===st.champ?'good':''}"><h2>${i===st.champ?'ŞAMPİYONSUNUZ!':'Şampiyon: '+esc(champ)}</h2><p>${esc(st.title)} sona erdi. Katıldığınız için teşekkürler!</p></div>`;
  }
  if (i < 0) return plPick();
  const change = `<button class="linkbtn" data-pl="change">Sınıfı değiştir</button>`;
  if (st.v === 'teams'){
    return `<div class="pl-card big good"><h2>Hazırsınız!</h2><p><b>${esc(P.team)}</b> olarak ${esc(st.stageName)} için katıldınız. Sorular başlayınca burada görünecek.</p></div>${change}`;
  }
  if (st.v === 'question' || st.v === 'tie'){
    if (st.eligible && !st.eligible.includes(i)){
      return `<div class="pl-card big"><h2>Eşitlik sorusu</h2><p>Bu soruyu sadece ${st.eligible.map(x=>esc(st.teams[x])).join(' ve ')} cevaplıyor.</p></div>`;
    }
    if (st.hidden || !st.q){
      return `<div class="pl-card big"><h2>Soru ${st.qn||''} geliyor!</h2><p>${st.qType==='tahmin'?'Tahmin sorusu':'Şıklı soru'} · Hazır olun, soru ekrana gelince süre başlayacak.</p></div>`;
    }
    const q = st.q || {}, can = plCanAnswer(), mine = P.ans ? P.ans.v : null;
    const l = plLeft();
    const meta = `<div class="pl-meta"><span>${st.v==='tie'?'Eşitlik sorusu':(q.type==='tahmin'?'Tahmin sorusu':esc(q.subject||''))}${st.qn?` · ${st.qn}/${st.qt}`:''}</span><span class="pl-time ${l!=null&&l<=10?'warn':''}" id="pl-time">${l!=null?l:''}</span></div>`;
    let pad;
    if (q.type === 'ders'){
      pad = `<div class="pad ${(!can || mine)?'locked':''}">${LETTERS.map((L,k)=>`<button style="--k:${KCOL[k]}" class="${mine===L?'mine':''} ${st.revealed && st.answer===L?'mine':''}" data-pl="ans" data-v="${L}" ${can?'':'disabled'}><span class="sh">${SHAPES[k]}</span><b>${L}</b><span>${esc((q.options||[])[k]||'')}</span></button>`).join('')}</div>`;
    } else {
      pad = can ? `<div class="numin"><input class="field" id="pl-num" inputmode="decimal" autocomplete="off" value="${esc(P.draft)}" placeholder="Tahmininiz"><button class="btn primary big" data-pl="sendNum">Gönder</button></div>` : '';
    }
    let status;
    if (st.revealed){
      if (q.type === 'ders'){
        const ok = mine === st.answer;
        status = `<div class="pl-card big ${ok?'good':'bad'}"><h2>${ok?'DOĞRU! +10':(mine?'Yanlış':'Cevap verilmedi')}</h2><p>Doğru cevap: <b>${esc(st.answer)}</b>${mine?` · Sizin cevabınız: <b>${esc(mine)}</b>`:''}</p></div>`;
      } else {
        status = `<div class="pl-card big"><h2>Doğru cevap: ${st.answer!=null?fmt(st.answer):'—'} ${esc(q.unit||'')}</h2><p>${mine!=null?`Sizin tahmininiz: <b>${fmt(mine)}</b>. En yakın sınıf birazdan ekranda.`:'Tahmin gönderilmedi.'}</p></div>`;
      }
    } else if (mine != null){
      status = `<div class="sent">Cevabınız gönderildi: ${esc(typeof mine==='number'?fmt(mine):mine)}${can?' · süre bitene kadar değiştirebilirsiniz':''}</div>`;
    } else if (!can){
      status = `<div class="sent" style="color:var(--bad)">Süre doldu.</div>`;
    } else status = '';
    return `<div class="pl-card">${meta}<p class="pl-q">${esc(q.text||'')}</p>${q.unit && !st.revealed?`<p class="status" style="margin:0">Birim: ${esc(q.unit)}</p>`:''}</div>${pad}${status}`;
  }
  if (st.v === 'scoreboard'){
    const won = (st.lastWinners||[]).includes(i);
    const order = (st.scores||[]).map((s,k)=>({s,k})).sort((a,b)=>b.s-a.s), rank = order.findIndex(o=>o.k===i) + 1;
    return `<div class="pl-card big ${won?'good':''}"><h2>${won?'+10 PUAN!':'Bu soruda puan yok'}</h2><p>Toplam: <b>${st.scores[i]}</b> puan · Sıralama: <b>${rank}.</b> / ${st.teams.length}</p></div>`;
  }
  if (st.v === 'stageEnd'){
    const q = (st.qualified||[]).includes(i), tie = (st.eligible||[]).includes(i);
    if (st.stage === 'final') return `<div class="pl-card big"><h2>${tie?'Eşitlik var!':'Final bitti'}</h2><p>${tie?'Ek tahmin sorusu geliyor, hazır olun!':'Şampiyon birazdan açıklanacak.'}</p></div>`;
    if (q) return `<div class="pl-card big good"><h2>FİNALDESİNİZ!</h2><p>${esc(P.team)} finale çıktı. Tebrikler!</p></div>`;
    if (tie) return `<div class="pl-card big"><h2>Eşitlik var!</h2><p>Finale çıkmak için ek tahmin sorusu geliyor, hazır olun!</p></div>`;
    if (st.tiePending) return `<div class="pl-card big"><h2>${esc(st.stageName)} bitti</h2><p>Eşitlik sorusu bekleniyor.</p></div>`;
    return `<div class="pl-card big"><h2>${esc(st.stageName)} bitti</h2><p>Katıldığınız için teşekkürler, ${esc(P.team)}!</p></div>`;
  }
  return `<div class="pl-card big"><h2>Bekleniyor…</h2></div>`;
}
function plTickPaint(){
  const el = document.getElementById('pl-time'); if (!el) return;
  const l = plLeft(); el.textContent = l != null ? l : ''; el.classList.toggle('warn', l != null && l <= 10);
}
function playerInit(){
  plLoad();
  const qp = new URLSearchParams(location.search), urlPin = (qp.get('pin') || '').replace(/\D/g,'');
  if (urlPin && urlPin !== P.pin){ P.pin = urlPin; P.team = null; }
  P.view = 'loading'; plRender();
  netInit().then(ok=>{ if (!ok){ P.view = 'nonet'; return plRender(); } P.view = 'pin'; if (P.pin && (urlPin || P.team)) plJoin(P.pin); else plRender(); });
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-pl]'); if (!b || b.disabled) return;
    const a = b.dataset.pl; P.err = '';
    if (a === 'join') plJoin(document.getElementById('pl-pin').value);
    else if (a === 'pick'){
      const i = +b.dataset.i, j = P.players && P.players[i];
      if (j && j.dev !== P.dev){ P.confirmPick = i; plRender(); }
      else { P.team = P.st.teams[i]; P.confirmPick = null; P.claimedFor = null; plSave(); plOnState(); }
    }
    else if (a === 'pickYes'){ P.team = P.st.teams[P.confirmPick]; P.confirmPick = null; P.claimedFor = null; plSave(); plOnState(); }
    else if (a === 'pickNo'){ P.confirmPick = null; plRender(); }
    else if (a === 'change'){ P.team = null; plSave(); plOnState(); }
    else if (a === 'ans'){ plSend(b.dataset.v); }
    else if (a === 'sendNum'){
      const raw = (document.getElementById('pl-num')?.value || '').trim(), n = parseNum(raw);
      if (n == null){ P.err = 'Lütfen sayı girin (ondalık için virgül).'; return plRender(); }
      plSend(n, raw);
    }
  });
  document.addEventListener('input', e=>{ if (e.target.id === 'pl-num') P.draft = e.target.value; });
  document.addEventListener('keydown', e=>{
    if (e.key !== 'Enter') return;
    if (e.target.id === 'pl-pin') plJoin(e.target.value);
    if (e.target.id === 'pl-num') document.querySelector('[data-pl="sendNum"]')?.click();
  });
  setInterval(()=>{
    plTickPaint();
    const lock = !plCanAnswer();
    if (lock !== P.locked){ P.locked = lock; if (P.view === 'game') plRender(); }
  }, 250);
}

if (IS_PLAYER) playerInit(); else hostInit();
</script>
